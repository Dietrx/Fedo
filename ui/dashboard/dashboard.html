<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fedo Shield — Dashboard</title>
    <style>
      /* Theme variables are injected by dashboard.js (ui/theme.ts); this file only uses tokens. */
      * { box-sizing: border-box; }
      html { background: var(--ground); }
      body { margin: 0; min-height: 100vh; padding: 32px 24px 48px; font: 14px/20px var(--font-sans); color: var(--ink);
             background: var(--ground); background-image: radial-gradient(var(--hairline) 1px, transparent 1px); background-size: 24px 24px; }
      main { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
      a { color: inherit; }

      .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
      h1 { margin: 0; font: 700 28px/32px var(--font-display); letter-spacing: -.02em; }
      .micro { font: 600 11px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
      .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

      .seg { display: inline-flex; height: 36px; padding: 3px; gap: 3px; background: var(--surface-sunken); border-radius: var(--radius-pill); }
      .seg label { position: relative; display: inline-flex; align-items: center; padding: 0 12px; border-radius: var(--radius-pill); font: 600 13px/18px var(--font-sans); color: var(--ink-muted); cursor: pointer; }
      .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .seg label:has(input:checked) { background: var(--action); color: var(--on-action); }
      .seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
      .btn { height: 36px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid transparent; font: 600 13px/18px var(--font-sans); cursor: pointer; transition: box-shadow .15s; }
      .btn.primary { background: var(--action); color: var(--on-action); height: 44px; padding: 0 20px; font-size: 14px; }
      .btn.primary:hover { box-shadow: var(--glow-action); }
      .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--ink); }
      .btn.ghost { background: transparent; color: var(--ink-muted); }
      .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
      @media (max-width: 820px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
      .card { position: relative; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 20px; }
      .card h2 { margin: 0 0 12px; }
      .c { position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--ink); }
      .c.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; border-top-left-radius: 4px; }
      .c.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; border-top-right-radius: 4px; }
      .c.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; border-bottom-left-radius: 4px; }
      .c.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; border-bottom-right-radius: 4px; }
      .readout { font: 700 32px/36px var(--font-mono); letter-spacing: -.02em; }
      .sub { color: var(--ink-muted); font-size: 13px; }

      .dist { display: flex; height: 8px; border-radius: var(--radius-pill); overflow: hidden; background: var(--surface-sunken); margin-bottom: 8px; }
      .dist i { display: block; height: 100%; }
      .leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 11px/14px var(--font-sans); color: var(--ink-muted); margin-bottom: 16px; }
      .leg i, .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      [data-group="political"] > .k, [data-group="political"] > i, .dist [data-group="political"] { background: var(--cat-political); }
      [data-group="rhetoric"] > .k, [data-group="rhetoric"] > i, .dist [data-group="rhetoric"] { background: var(--cat-rhetoric); }
      [data-group="credibility"] > .k, [data-group="credibility"] > i, .dist [data-group="credibility"] { background: var(--cat-credibility); }
      [data-group="synthetic"] > .k, [data-group="synthetic"] > i, .dist [data-group="synthetic"] { background: var(--cat-synthetic); }
      [data-group="political"] .fill { background: var(--cat-political); } [data-group="rhetoric"] .fill { background: var(--cat-rhetoric); }
      [data-group="credibility"] .fill { background: var(--cat-credibility); } [data-group="synthetic"] .fill { background: var(--cat-synthetic); }

      .rank { display: grid; gap: 8px; }
      .rank .row { display: grid; grid-template-columns: 1fr 44px; column-gap: 12px; row-gap: 4px; align-items: center; }
      .rank .lbl { font: 500 13px/18px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rank .n { text-align: right; font: 700 12px/16px var(--font-mono); color: var(--ink-muted); }
      .meter { grid-column: 1 / -1; height: 6px; border-radius: var(--radius-sm); overflow: hidden;
               background: linear-gradient(var(--hairline),var(--hairline)) 25% 0/1px 100% no-repeat, linear-gradient(var(--hairline),var(--hairline)) 50% 0/1px 100% no-repeat, linear-gradient(var(--hairline),var(--hairline)) 75% 0/1px 100% no-repeat, var(--surface-sunken); }
      .fill { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--ink); transition: width .4s ease-out; }

      .src { display: grid; gap: 6px; }
      .src .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--hairline); }
      .src .row:first-child { border-top: 0; }
      .src .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
      .src .who span { color: var(--ink-muted); font-weight: 400; }
      .src .dots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
      .src .n { font: 700 12px/16px var(--font-mono); color: var(--ink-muted); min-width: 24px; text-align: right; }

      .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
      .filters .seg { height: 32px; } .filters .seg label { padding: 0 10px; font-size: 12px; }
      .sw { position: relative; width: 36px; height: 22px; flex: none; }
      .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .sw span { position: absolute; inset: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); border: 1px solid var(--hairline); }
      .sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1px solid var(--hairline); transition: transform .15s; }
      .sw input:checked + span { background: var(--action); border-color: var(--action); }
      .sw input:checked + span::after { transform: translateX(14px); background: var(--on-action); border-color: var(--action); }
      .lbl2 { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }

      .posts { display: grid; }
      .post { border-top: 1px solid var(--hairline); padding: 12px 0; display: grid; grid-template-columns: 56px 1fr auto; column-gap: 14px; row-gap: 6px; cursor: pointer; }
      .post:hover .ex { color: var(--ink); }
      .post .t { font: 600 11px/16px var(--font-mono); letter-spacing: .06em; color: var(--ink-muted); }
      .post .t b { display: block; color: var(--ink); }
      .post .who { font-weight: 600; } .post .who span { color: var(--ink-muted); font-weight: 400; }
      .post .ex { color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .post .labs { font: 500 12px/16px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .post .labs b { font: 600 11px/16px var(--font-mono); color: var(--ink-muted); }
      .post .sep { color: var(--hairline); margin: 0 6px; }
      .lvl { font: 600 11px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); align-self: start; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--surface-sunken); }
      .lvl.high { color: var(--ink); }
      .lvl.slop { color: var(--cat-synthetic-ink); background: var(--cat-synthetic-tint); }
      .det { grid-column: 2 / -1; display: none; padding: 8px 0 4px; }
      .post.open .det { display: block; }
      .det p { margin: 0 0 8px; }
      .det .row { display: grid; grid-template-columns: 1fr 44px; column-gap: 12px; row-gap: 4px; align-items: center; padding: 6px 0; border-top: 1px solid var(--hairline); }
      .det .lbl { font: 500 13px/18px var(--font-sans); } .det .n { text-align: right; font: 700 12px/16px var(--font-mono); }
      .det .ev { grid-column: 1 / -1; color: var(--ink-muted); font-style: italic; font-size: 13px; }
      .det .open { margin-top: 10px; display: inline-block; font: 600 11px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); text-decoration: none; }
      .det .open:hover { color: var(--ink); }
      .empty { padding: 40px 0; text-align: center; color: var(--ink-muted); display: grid; gap: 12px; justify-items: center; }
      .foot { text-align: center; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div class="hd">
        <div><div class="micro">Analysis dashboard</div><h1>Fedo Shield</h1></div>
        <div class="tools">
          <div class="seg" role="radiogroup" aria-label="Time window">
            <label><input type="radio" name="win" value="today" />Today</label>
            <label><input type="radio" name="win" value="7d" checked />7 days</label>
            <label><input type="radio" name="win" value="all" />All</label>
          </div>
          <button class="btn secondary" id="export">Export JSON</button>
          <button class="btn ghost" id="reset">Reset</button>
        </div>
      </div>

      <section class="grid4">
        <div class="card"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><h2 class="micro">Analyzed</h2><div class="readout" id="nAll">0</div><div class="sub" id="nAllSub">posts</div></div>
        <div class="card"><h2 class="micro">With signals</h2><div class="readout" id="nSig">0</div><div class="sub" id="nSigSub">0% of feed</div></div>
        <div class="card"><h2 class="micro">Heavy use</h2><div class="readout" id="nHigh">0</div><div class="sub">overall level high</div></div>
        <div class="card"><h2 class="micro">AI slop</h2><div class="readout" id="nSlop">0</div><div class="sub">posts covered</div></div>
      </section>

      <section class="grid2">
        <div class="card">
          <h2 class="micro">Techniques</h2>
          <div class="dist" id="dist"></div><div class="leg" id="legend"></div>
          <div class="rank" id="rank"></div>
        </div>
        <div class="card">
          <h2 class="micro">Sources with most signals</h2>
          <div class="src" id="src"></div>
        </div>
      </section>

      <section class="card">
        <h2 class="micro">Posts</h2>
        <div class="filters">
          <div class="seg" role="radiogroup" aria-label="Platform">
            <label><input type="radio" name="pf" value="all" checked />All</label>
            <label><input type="radio" name="pf" value="x" />X</label>
            <label><input type="radio" name="pf" value="tiktok" />TikTok</label>
          </div>
          <div class="seg" role="radiogroup" aria-label="Level">
            <label><input type="radio" name="lv" value="all" checked />Any level</label>
            <label><input type="radio" name="lv" value="high" />High</label>
            <label><input type="radio" name="lv" value="medium" />Medium</label>
            <label><input type="radio" name="lv" value="low" />Low</label>
          </div>
          <label class="lbl2"><span class="sw"><input id="onlySlop" type="checkbox" /><span></span></span>Only AI slop</label>
          <span class="micro" id="count" style="margin-left:auto"></span>
        </div>
        <div class="posts" id="posts"></div>
      </section>

      <div class="foot micro">Techniques, not opinions</div>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
