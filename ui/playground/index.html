<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fedo UI Playground</title>
    <style>
      body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.4 system-ui, sans-serif; }
      main { max-width: 600px; margin: 0 auto; border-inline: 1px solid #2f3336; }
      header { padding: 12px 16px; border-bottom: 1px solid #2f3336; display: flex; gap: 8px; align-items: center; }
      header h1 { font-size: 18px; margin: 0 auto 0 0; }
      header button { background: #1d9bf0; color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      article { padding: 12px 16px; border-bottom: 1px solid #2f3336; }
      .author { font-weight: 700; } .handle { color: #71767b; font-weight: 400; }
      .text { margin: 4px 0; white-space: pre-wrap; }
      .text img { max-width: 100%; border-radius: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Fedo UI Playground</h1>
        <button id="replay">Replay (pending → done)</button>
        <button id="live">Simulate live video</button>
      </header>
      <div id="feed"></div>
    </main>
    <script src="playground.js"></script>
  </body>
</html>
