<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fedo</title>
    <style>
      body { margin: 0; width: 260px; padding: 16px; font: 13px/1.4 system-ui, sans-serif; background: #15181c; color: #e7e9ea; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
      input[type="range"] { width: 110px; }
      .hint { color: #8b98a5; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>🛡️ Fedo Shield</h1>
    <label>Enabled <input id="enabled" type="checkbox" /></label>
    <label>Sensitivity <input id="minScore" type="range" min="0.3" max="0.9" step="0.05" /></label>
    <p class="hint">Reload the feed tab after changing settings.</p>
    <script src="popup.js"></script>
  </body>
</html>
